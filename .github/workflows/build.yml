# Builds and tests DupliFoto, then publishes the portable Windows executables (x64 and ARM64).
# - Every push: executables available as a build artifact (Actions → run → Artifacts).
# - "Run workflow" with a version: prepares a DRAFT release with every file; publish it from the Releases page.
# - Tag vX.Y.Z: attaches the files to that release (creating it if needed).
# See README, "Releasing".
name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      version:
        description: "Prepare a draft release for this version (for example 0.2.0). Leave empty for a normal build."
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}-${{ inputs.version }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.version == '' }}

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: 1
  AVALONIA_TELEMETRY_OPTOUT: 1

jobs:
  linux:
    name: Linux (build and tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Build
        run: dotnet build DupliFoto.slnx -c Release
      - name: Test
        run: dotnet test DupliFoto.slnx -c Release --no-build

  windows:
    name: Windows 11 (Server 2025)
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if ($env:GITHUB_REF -like 'refs/tags/v*') { $v = $env:GITHUB_REF_NAME.Substring(1) }
          elseif ($env:INPUT_VERSION) { $v = $env:INPUT_VERSION.Trim().TrimStart('v') }
          else { $v = '' }
          if ($v) {
            if ($v -notmatch '^\d+\.\d+\.\d+$') { throw "Invalid version '$v': use MAJOR.MINOR.PATCH, for example 0.2.0" }
            "DUPLIFOTO_VERSION=$v" >> $env:GITHUB_ENV
          } else {
            $v = (dotnet msbuild src/DupliFoto.Core/DupliFoto.Core.csproj -getProperty:Version).Trim()
          }
          "VERSION=$v" >> $env:GITHUB_ENV
          "version=$v" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $v"

      - name: Build
        run: dotnet build DupliFoto.slnx -c Release

      - name: Test (engine and app)
        env:
          DUPLIFOTO_SCREENSHOTS: ${{ runner.temp }}\screenshots\test
        run: dotnet test DupliFoto.slnx -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish portable executables
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          foreach ($arch in 'x64', 'arm64') {
            dotnet publish src/DupliFoto.Gui -c Release -f net10.0-windows10.0.26100.0 -r win-$arch -o out/gui-$arch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            dotnet publish src/DupliFoto.Cli -c Release -r win-$arch -o out/cli-$arch
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            # Portable means one file: anything else next to the executable would be missing at run time.
            $extra = Get-ChildItem out/gui-$arch, out/cli-$arch -File | Where-Object Name -notin 'DupliFoto.exe', 'duplifoto-cli.exe'
            if ($extra) { $extra | Format-Table Name, Length | Out-String | Write-Host; throw "The publish output is not a single file" }
            Copy-Item out/gui-$arch/DupliFoto.exe "dist/DupliFoto-$env:VERSION-$arch.exe"
            Copy-Item out/cli-$arch/duplifoto-cli.exe "dist/duplifoto-cli-$env:VERSION-$arch.exe"
          }
          powershell -File tools\raccogli-licenze.ps1 -Destination out\licenses -Rid win-x64
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          Compress-Archive -Path out\licenses\* -DestinationPath "dist\DupliFoto-$env:VERSION-licenses.zip"
          Get-ChildItem dist | Format-Table Name, @{ n = 'MB'; e = { [math]::Round($_.Length / 1MB, 1) } } | Out-String | Write-Host

      - name: Test the executables on real photos
        shell: powershell
        run: tools\prova-windows.ps1 -Gui "dist\DupliFoto-$env:VERSION-x64.exe" -Cli "dist\duplifoto-cli-$env:VERSION-x64.exe" -Full -Screenshot "$env:RUNNER_TEMP\screenshots\app-windows-2025.png"

      - uses: actions/upload-artifact@v7
        with:
          name: DupliFoto-${{ steps.version.outputs.version }}
          path: dist
          if-no-files-found: error

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows-2025
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # Windows Server 2022 shares its base with Windows 10 21H2 (no Mica, pre-Windows 11 build):
  # the closest thing to Windows 10 that GitHub offers.
  windows-10-base:
    name: Windows 10 base (Server 2022)
    needs: windows
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      VERSION: ${{ needs.windows.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: DupliFoto-${{ needs.windows.outputs.version }}
          path: dist

      - name: Test the executables on real photos
        shell: powershell
        run: tools\prova-windows.ps1 -Gui "dist\DupliFoto-$env:VERSION-x64.exe" -Cli "dist\duplifoto-cli-$env:VERSION-x64.exe" -Screenshot "$env:RUNNER_TEMP\screenshots\app-windows-2022.png"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: screenshots-windows-2022
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore

  # Only for a tag vX.Y.Z or a manual run with a version, and only when every test above has passed.
  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v') || inputs.version != ''
    needs: [linux, windows, windows-10-base]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.windows.outputs.version }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: DupliFoto-${{ needs.windows.outputs.version }}
          path: dist

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Release notes
        run: |
          awk -v v="$VERSION" '
            $0 ~ "^## \\[" v "\\]" { found = 1; next }
            found && /^## \[/ { exit }
            found && /^\[[^]]+\]: / { next }
            found { print }
          ' CHANGELOG.md > changes.md
          if [ ! -s changes.md ]; then echo "CHANGELOG.md has no section for [$VERSION]" >&2; exit 1; fi
          python3 - <<'PY'
          import os, pathlib
          notes = pathlib.Path(".github/release-notes.md").read_text(encoding="utf-8")
          notes = notes.replace("{{CHANGES}}", pathlib.Path("changes.md").read_text(encoding="utf-8").strip())
          notes = notes.replace("{{VERSION}}", os.environ["VERSION"])
          pathlib.Path("notes.md").write_text(notes, encoding="utf-8")
          PY
          cat notes.md

      - name: Publish
        run: |
          tag="v$VERSION"
          title="DupliFoto $VERSION"
          if gh release view "$tag" > /dev/null 2>&1; then
            draft=$(gh release view "$tag" --json isDraft -q .isDraft)
            assets=$(gh release view "$tag" --json assets -q '.assets | length')
            if [ "$draft" = "false" ] && [ "$assets" -gt 0 ]; then
              echo "Release $tag is already published with its files: nothing to do."
              exit 0
            fi
            gh release upload "$tag" dist/* --clobber
            gh release edit "$tag" --title "$title" --notes-file notes.md
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            gh release create "$tag" dist/* --verify-tag --title "$title" --notes-file notes.md
          else
            existing=$(git ls-remote --tags origin "refs/tags/$tag" | cut -f1)
            if [ -n "$existing" ] && [ "$existing" != "$GITHUB_SHA" ]; then
              echo "Tag $tag already exists on another commit: delete it or choose another version." >&2
              exit 1
            fi
            gh release create "$tag" dist/* --draft --target "$GITHUB_SHA" --title "$title" --notes-file notes.md
            echo "Draft release $tag ready: review it on the Releases page and press Publish."
          fi
